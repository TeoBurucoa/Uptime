<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --ink: #1c1915;
      --muted: #6d675f;
      --card: #fffdf8;
      --line: #e3dcd0;
      --up: #1f7a45;
      --up-soft: #e7f5ec;
      --down: #b42318;
      --down-soft: #fdecea;
      --amber: #9a6700;
      --track: #ece6da;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
      overflow-x: hidden;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 22px;
    }

    .kicker {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    h2 { margin: 0; font-size: 18px; }

    .summary {
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 650;
    }

    .summary.all-up { color: var(--up); }
    .summary.has-down { color: var(--down); }

    .panel, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .panel { padding: 18px 20px 12px; margin-bottom: 18px; }

    .panel-head, .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      font: inherit;
      color: white;
      background: var(--ink);
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }

    button:hover { background: #3a342c; }

    .error {
      background: var(--down-soft);
      color: var(--down);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .loading, .empty, .footnote, .detail, .meta, .legend {
      color: var(--muted);
    }

    .ov-row {
      display: grid;
      grid-template-columns: minmax(140px, 240px) 1fr auto;
      gap: 12px;
      align-items: center;
      margin: 12px 0;
    }

    .ov-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .ov-name span:last-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
    }

    .dot.up { background: var(--up); }
    .dot.down { background: var(--down); }

    .track {
      height: 14px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .track.empty-down { background: #f3c7c2; }

    .fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--up);
      transition: width 0.35s ease;
    }

    .fill.warn { background: var(--amber); }
    .fill.bad { background: var(--down); }

    .pct {
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      min-width: 4.5rem;
      text-align: right;
    }

    .card {
      padding: 18px 20px 16px;
      margin-bottom: 16px;
      border-left: 4px solid var(--muted);
    }

    .card.up { border-left-color: var(--up); }
    .card.down { border-left-color: var(--down); }

    .identity { min-width: 0; }
    .identity h3 { margin: 0 0 4px; font-size: 20px; }
    .domain {
      margin: 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-block;
      margin-right: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .status {
      margin: 6px 0 0;
      font-weight: 650;
    }

    .card.up .status { color: var(--up); }
    .card.down .status { color: var(--down); }

    .score {
      text-align: right;
    }

    .score strong {
      display: block;
      font-size: 28px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .score span {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    .chart {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      margin-top: 14px;
      background: #f7f4ee;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .strip {
      display: flex;
      gap: 2px;
      height: 22px;
      margin-top: 10px;
    }

    .cell {
      flex: 1 1 0;
      min-width: 0;
      border-radius: 3px;
      background: var(--muted);
    }

    .cell.up { background: var(--up); }
    .cell.down { background: var(--down); }

    .legend { display: flex; gap: 14px; align-items: center; margin: 8px 0 0; font-size: 13px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 4px; }
    .swatch.up { background: var(--up); }
    .swatch.down { background: var(--down); }

    .detail, .meta { margin: 8px 0 0; font-size: 13px; overflow-wrap: anywhere; }
    .footnote { margin: 18px 0 0; font-size: 13px; }

    @media (max-width: 720px) {
      .top, .card-head, .panel-head { align-items: flex-start; flex-direction: column; }
      .score, .pct { text-align: left; }
      .ov-row { grid-template-columns: 1fr; }
      .panel, .card, .wrap { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .fill { transition: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="kicker">Surveillance</p>
        <h1>Uptime</h1>
      </div>
      <div class="summary" id="summary">Chargement…</div>
    </header>

    <p class="error" id="error" hidden></p>
    <p class="loading" id="loading">Chargement des mesures…</p>

    <section class="panel" id="overview-panel">
      <div class="panel-head">
        <h2 id="overview-title">Uptime sur 24 heures</h2>
        <button type="button" id="refresh">Actualiser</button>
      </div>
      <div id="overview"></div>
    </section>

    <div id="cards"></div>
    <p class="footnote" id="meta"></p>
  </div>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const summaryEl = document.getElementById("summary");
    const errorEl = document.getElementById("error");
    const loadingEl = document.getElementById("loading");
    const overviewEl = document.getElementById("overview");
    const cardsEl = document.getElementById("cards");
    const metaEl = document.getElementById("meta");

    const clock = new Intl.DateTimeFormat("fr-FR", {
      hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    const stamp = new Intl.DateTimeFormat("fr-FR", {
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"
    });
    const percent = new Intl.NumberFormat("fr-FR", {
      style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1
    });

    document.getElementById("refresh").addEventListener("click", load);
    load();
    setInterval(load, 15000);

    async function load() {
      try {
        const response = await fetch("/api/status", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        render(await response.json());
        errorEl.hidden = true;
      } catch (err) {
        console.error(err);
        errorEl.hidden = false;
        errorEl.textContent = "Impossible de récupérer les mesures.";
      } finally {
        loadingEl.hidden = true;
      }
    }

    function render(data) {
      const targets = data.targets || [];
      renderSummary(targets);
      renderOverview(targets);
      renderCards(targets);
      const updated = data.generated_at ? clock.format(new Date(data.generated_at)) : "—";
      metaEl.textContent =
        "Contrôle " + formatEvery(data.frequency_seconds) +
        ". Historique conservé " + data.retain_days + " jours. Mis à jour à " + updated + ".";
    }

    function renderSummary(targets) {
      const up = targets.filter((target) => target.is_up === true).length;
      const down = targets.filter((target) => target.is_up === false).length;
      const waiting = targets.length - up - down;
      summaryEl.className = "summary";
      if (!targets.length) {
        summaryEl.textContent = "Aucune cible";
        return;
      }
      const parts = [up + " en ligne"];
      if (down) parts.push(down + " en panne");
      if (waiting) parts.push(waiting + " en attente");
      summaryEl.textContent = parts.join(" · ");
      if (down) summaryEl.classList.add("has-down");
      else if (!waiting) summaryEl.classList.add("all-up");
    }

    function renderOverview(targets) {
      overviewEl.replaceChildren();
      if (!targets.length) {
        overviewEl.appendChild(h("p", "empty", "Ajoutez des cibles dans le fichier de domaines."));
        return;
      }
      targets.forEach((target) => overviewEl.appendChild(overviewRow(target)));
    }

    function overviewRow(target) {
      const ratio = target.uptime_24h;
      const row = h("div", "ov-row");
      const name = h("div", "ov-name");
      name.appendChild(h("span", "dot " + statusClass(target)));
      name.appendChild(h("span", "", target.label));
      const track = h("div", "track");
      track.setAttribute("aria-hidden", "true");
      const fill = h("div", "fill " + tone(ratio));
      if (ratio === 0) track.classList.add("empty-down");
      fill.style.width = ratio === null ? "0%" : (ratio * 100) + "%";
      track.appendChild(fill);
      row.append(name, track, h("span", "pct", formatPct(ratio)));
      return row;
    }

    function renderCards(targets) {
      cardsEl.replaceChildren();
      targets.forEach((target) => cardsEl.appendChild(cardFor(target)));
    }

    function cardFor(target) {
      const card = h("article", "card " + statusClass(target));
      const head = h("div", "card-head");
      const identity = h("div", "identity");
      identity.appendChild(h("h3", "", target.label));
      const domain = h("p", "domain");
      domain.appendChild(h("span", "badge", target.protocol));
      domain.append(document.createTextNode(target.domain));
      identity.appendChild(domain);
      identity.appendChild(h("p", "status", statusLabel(target)));
      const score = h("div", "score");
      score.appendChild(h("strong", "", formatPct(target.uptime_24h)));
      score.appendChild(h("span", "", "sur 24 h"));
      if (target.samples_all !== target.samples_24h && target.uptime_all !== null) {
        score.appendChild(h("span", "aside", "Historique : " + formatPct(target.uptime_all)));
      }
      head.append(identity, score);
      card.appendChild(head);

      if (target.incident_started_at && target.is_up === false) {
        card.appendChild(h("p", "detail", "Incident ouvert depuis " + formatElapsed(target.incident_started_at) + "."));
      }

      const timeline = target.timeline || [];
      if (timeline.length) {
        const chart = document.createElementNS(SVG_NS, "svg");
        chart.setAttribute("class", "chart");
        chart.setAttribute("width", "100%");
        drawChart(chart, timeline);
        card.appendChild(chart);
        card.appendChild(strip(timeline));
        const legend = h("p", "legend");
        legend.append(h("span", "swatch up"), document.createTextNode(" Joignable "));
        legend.append(h("span", "swatch down"), document.createTextNode(" Panne"));
        card.appendChild(legend);
      } else {
        card.appendChild(h("p", "empty", "Le graphique apparaîtra après le premier contrôle."));
      }

      const bits = [];
      if (target.last_checked_at) bits.push("Dernier contrôle " + stamp.format(new Date(target.last_checked_at)));
      if (target.latency_ms !== null && target.latency_ms !== undefined) bits.push(target.latency_ms + " ms");
      if (target.detail) bits.push(target.detail);
      if (bits.length) card.appendChild(h("p", "detail", bits.join(" · ")));
      card.appendChild(h("p", "meta", "Alerte envoyée à " + target.to_email));
      const samples = target.samples_24h || 0;
      card.appendChild(h("p", "meta", samples + " mesure" + (samples > 1 ? "s" : "") + " sur 24 h"));
      return card;
    }

    function strip(timeline) {
      const row = h("div", "strip");
      timeline.forEach((point) => {
        const cell = h("div", "cell " + (point.up ? "up" : "down"));
        const latency = point.latency_ms === null || point.latency_ms === undefined ? "" : " · " + point.latency_ms + " ms";
        cell.title = stamp.format(new Date(point.checked_at)) + " · " + (point.up ? "joignable" : "panne") + latency;
        row.appendChild(cell);
      });
      return row;
    }

    function drawChart(svg, timeline) {
      const width = 640;
      const height = 168;
      const padL = 36;
      const padR = 12;
      const padT = 16;
      const padB = 28;
      const yUp = padT + 8;
      const yDown = height - padB - 8;
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("role", "img");
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      if (!timeline.length) {
        svg.setAttribute("aria-label", "Aucune mesure");
        svg.appendChild(svgText(width / 2, height / 2, "Aucune mesure", "middle"));
        return;
      }

      const upCount = timeline.filter((point) => point.up).length;
      svg.setAttribute("aria-label", upCount + " contrôles joignables sur " + timeline.length);

      [yUp, yDown].forEach((y) => {
        svg.appendChild(svgLine(padL, y, width - padR, y, "var(--line)", 1));
      });
      svg.appendChild(svgText(4, yUp + 4, "OK", "start"));
      svg.appendChild(svgText(4, yDown, "KO", "start"));

      const xs = timeline.map((_, index) => {
        if (timeline.length === 1) return (padL + width - padR) / 2;
        return padL + (index / (timeline.length - 1)) * (width - padL - padR);
      });
      const yOf = (point) => point.up ? yUp : yDown;

      if (timeline.length === 1) {
        const y = yOf(timeline[0]);
        svg.appendChild(band(padL, width - padR, yUp, yDown, timeline[0].up));
        svg.appendChild(svgLine(padL, y, width - padR, y, stroke(timeline[0].up), 3));
        svg.appendChild(dot(xs[0], y, timeline[0].up));
        svg.appendChild(svgText(width / 2, height - 8, stamp.format(new Date(timeline[0].checked_at)), "middle"));
        return;
      }

      for (let index = 0; index < timeline.length - 1; index += 1) {
        const point = timeline[index];
        const x1 = xs[index];
        const x2 = xs[index + 1];
        svg.appendChild(band(x1, x2, yUp, yDown, point.up));
        const line = svgLine(x1, yOf(point), x2, yOf(point), stroke(point.up), 3);
        line.appendChild(svgTitle(point));
        svg.appendChild(line);
        const next = timeline[index + 1];
        if (point.up !== next.up) {
          svg.appendChild(svgLine(x2, yOf(point), x2, yOf(next), "var(--muted)", 2));
        }
      }

      timeline.forEach((point, index) => {
        if (timeline.length <= 24 || index === timeline.length - 1) {
          const marker = dot(xs[index], yOf(point), point.up);
          marker.appendChild(svgTitle(point));
          svg.appendChild(marker);
        }
      });

      svg.appendChild(svgText(xs[0], height - 8, stamp.format(new Date(timeline[0].checked_at)), "start"));
      svg.appendChild(svgText(xs[xs.length - 1], height - 8, stamp.format(new Date(timeline[timeline.length - 1].checked_at)), "end"));
    }

    function band(x1, x2, yUp, yDown, up) {
      const rect = document.createElementNS(SVG_NS, "rect");
      rect.setAttribute("x", String(Math.min(x1, x2)));
      rect.setAttribute("y", String(yUp));
      rect.setAttribute("width", String(Math.max(Math.abs(x2 - x1), 1)));
      rect.setAttribute("height", String(yDown - yUp));
      rect.setAttribute("fill", up ? "var(--up)" : "var(--down)");
      rect.setAttribute("opacity", up ? "0.14" : "0.2");
      return rect;
    }

    function svgLine(x1, y1, x2, y2, color, size) {
      const line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("x1", String(x1));
      line.setAttribute("y1", String(y1));
      line.setAttribute("x2", String(x2));
      line.setAttribute("y2", String(y2));
      line.setAttribute("stroke", color);
      line.setAttribute("stroke-width", String(size));
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("vector-effect", "non-scaling-stroke");
      return line;
    }

    function stroke(up) {
      return up ? "var(--up)" : "var(--down)";
    }

    function dot(x, y, up) {
      const circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("cx", String(x));
      circle.setAttribute("cy", String(y));
      circle.setAttribute("r", "4");
      circle.setAttribute("fill", stroke(up));
      return circle;
    }

    function svgText(x, y, value, anchor) {
      const text = document.createElementNS(SVG_NS, "text");
      text.setAttribute("x", String(x));
      text.setAttribute("y", String(y));
      text.setAttribute("text-anchor", anchor);
      text.setAttribute("fill", "var(--muted)");
      text.setAttribute("font-size", "11");
      text.setAttribute("font-family", "Segoe UI, system-ui, sans-serif");
      text.textContent = value;
      return text;
    }

    function svgTitle(point) {
      const title = document.createElementNS(SVG_NS, "title");
      const latency = point.latency_ms === null || point.latency_ms === undefined ? "" : " · " + point.latency_ms + " ms";
      title.textContent = stamp.format(new Date(point.checked_at)) + " · " + (point.detail || (point.up ? "joignable" : "panne")) + latency;
      return title;
    }

    function h(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    }

    function statusClass(target) {
      if (target.is_up === true) return "up";
      if (target.is_up === false) return "down";
      return "unknown";
    }

    function statusLabel(target) {
      if (target.is_up === true) return "En ligne";
      if (target.is_up === false) return "Hors ligne";
      return "En attente";
    }

    function tone(ratio) {
      if (ratio === null || ratio === undefined) return "";
      if (ratio >= 0.99) return "good";
      if (ratio >= 0.8) return "warn";
      return "bad";
    }

    function formatPct(ratio) {
      if (ratio === null || ratio === undefined) return "—";
      return percent.format(ratio);
    }

    function formatEvery(seconds) {
      if (!seconds) return "en continu";
      if (seconds % 3600 === 0) {
        const hours = seconds / 3600;
        return hours === 1 ? "toutes les heures" : "toutes les " + hours + " heures";
      }
      if (seconds % 60 === 0) {
        const minutes = seconds / 60;
        return minutes === 1 ? "toutes les minutes" : "toutes les " + minutes + " minutes";
      }
      return "toutes les " + seconds + " secondes";
    }

    function formatElapsed(iso) {
      const seconds = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (days) return days + " j " + hours + " h";
      if (hours) return hours + " h " + minutes + " min";
      if (minutes) return minutes + " min";
      return seconds + " s";
    }
  </script>
</body>
</html>
